; Raises PHP's own upload limits for the admin video uploaders (Hajj Videos,
; Community Videos, Page Videos), which allow files up to 500MB. Without this,
; PHP-FPM rejects/truncates the upload before Laravel's own validation even
; runs, regardless of any `max:` rule in a FormRequest.
;
; .user.ini is picked up automatically by PHP-FPM per-directory (no server
; access needed) — this is Hostinger's supported way to override these
; without a php.ini change. Takes a few minutes to apply after a deploy
; (PHP-FPM caches .user.ini for ~5 minutes by default).
upload_max_filesize = 512M
post_max_size = 520M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
