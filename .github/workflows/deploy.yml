name: Deploy to live (naeemfoundation.co.uk)

# Runs automatically on every push to main (e.g. when you run `bash deploy.sh`
# from your Codespace), and can also be triggered manually from the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Never run two deploys at the same time.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-vps:
    runs-on: ubuntu-latest

    env:
      SERVER_HOST: 209.74.88.19
      SERVER_PORT: 22
      SERVER_USER: root
      APP_PATH: /home/naeeupql/naeemfoundation
      # public_html is a symlink straight to APP_PATH/public on this server,
      # so compiled assets/images are rsynced directly into the app's own
      # public/ folder — there's no separate served-docroot copy to keep in
      # sync like there is on Hostinger.
      PUBLIC_PATH: /home/naeeupql/naeemfoundation/public

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      # Key-based login (GitHub secret VPS_SSH_KEY = private key whose public
      # half is in the server's /root/.ssh/authorized_keys). No password is
      # used or stored, and the server's host key is verified from known_hosts.
      - name: Set up SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "${VPS_SSH_KEY}" ]; then
            echo "::error::Secret VPS_SSH_KEY is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SERVER_PORT}" -H "${SERVER_HOST}" >> ~/.ssh/known_hosts

      # public/build/ is git-tracked on this server (it's a plain `git pull`
      # deploy, not an rsynced-from-a-separate-source-tree setup like
      # Hostinger), so pull FIRST — discarding any local drift left by a
      # previous run's asset upload — then overwrite with this run's fresh
      # build. Doing it the other way round makes `git pull` fail with a
      # merge conflict against the files the previous upload just wrote.
      - name: Pull code, migrate and clear caches on the server
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -p ${SERVER_PORT} -o BatchMode=yes -o IdentitiesOnly=yes"
          ssh ${SSH_OPTS} "${SERVER_USER}@${SERVER_HOST}" \
            "cd ${APP_PATH} && git checkout -- public/build && git clean -fd public/build && git pull origin main && php artisan migrate --force && php artisan view:clear && php artisan cache:clear"

      - name: Upload compiled assets to the server
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -p ${SERVER_PORT} -o BatchMode=yes -o IdentitiesOnly=yes"
          # Compiled CSS/JS (safe to mirror with --delete)
          rsync -avz --delete -e "ssh ${SSH_OPTS}" \
            public/build/ "${SERVER_USER}@${SERVER_HOST}:${PUBLIC_PATH}/build/"
          # Images — NO --delete, so admin-uploaded hero images are never removed
          rsync -avz -e "ssh ${SSH_OPTS}" \
            public/images/ "${SERVER_USER}@${SERVER_HOST}:${PUBLIC_PATH}/images/"
          # Self-hosted fonts (e.g. Geogrotesque) — NO --delete
          rsync -avz -e "ssh ${SSH_OPTS}" \
            public/fonts/ "${SERVER_USER}@${SERVER_HOST}:${PUBLIC_PATH}/fonts/"
          # Annual report PDFs — NO --delete, so admin-uploaded reports are never removed
          rsync -avz -e "ssh ${SSH_OPTS}" \
            public/reports/ "${SERVER_USER}@${SERVER_HOST}:${PUBLIC_PATH}/reports/"
          # Fix ownership back to the cPanel account user after root-owned rsync.
          # public_html is a symlink into APP_PATH/public, and Apache serves it
          # as `nobody` — so both folders on that path must stay world-
          # traversable. If they end up 750 with the account's own group, the
          # whole site returns 403.
          ssh ${SSH_OPTS} "${SERVER_USER}@${SERVER_HOST}" \
            "chown -R naeeupql:naeeupql ${APP_PATH} && chmod 755 ${APP_PATH} ${PUBLIC_PATH}"
